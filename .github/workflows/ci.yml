# Revamp's spec §7.4 (xb00tt/revamp, docs/superpowers/specs/2026-10-14-revamp-v1-design.md): on every push, build and
# unit-test, then dry-run every app version the bundle lists against the real release. Stable versions must apply
# every patch; experimental ones only report. The engine is the pinned @revamp-app packages from npm, so `npx revamp`
# is the published CLI.
name: CI
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - id: matrix
        run: |
          node -e '
            const { apps } = JSON.parse(require("node:fs").readFileSync("dist/patches.json", "utf8"));
            const include = apps.flatMap((a) => Object.entries(a.versions).map(([version, v]) => ({ app: a.id, version, experimental: Boolean(v.experimental) })));
            console.log(`include=${JSON.stringify(include)}`);
          ' >> "$GITHUB_OUTPUT"

  dry-run:
    needs: test
    runs-on: ubuntu-latest
    name: dry-run ${{ matrix.app }} ${{ matrix.version }}${{ matrix.experimental && ' (experimental)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.include) }}
    # Experimental versions report only.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/revamp/releases/${{ matrix.app }}/${{ matrix.version }}
          key: release-${{ matrix.app }}-${{ matrix.version }}
      # Exit code 0 only when every selected patch applies. --bundle keeps the CLI off the sources (and off seeding the default one).
      - run: >-
          npx revamp patch ${{ matrix.app }} --version ${{ matrix.version }} --dry-run
          --bundle dist/official.mjs ${{ matrix.experimental && '--force' || '' }}
